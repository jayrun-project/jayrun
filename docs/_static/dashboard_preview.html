.progress {display:none}
.dashboard .progress {display:inline}
.progress-summary {display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 26px;border-bottom:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12px}
.progress-summary strong {color:var(--ink)}
.progress-summary .elapsed-fact[data-help] {display:inline-block;width:fit-content;max-width:100%}
.progress-state,.progress-value {font-size:10px;fill:var(--muted)}
.progress-track {fill:var(--line)}
.progress-fill {fill:var(--accent)}
.total-progress {display:inline-block;width:100px;height:5px;background:var(--line);overflow:hidden;border-radius:3px}
.total-progress span {display:block;height:100%;background:var(--accent)}
.dashboard .node[data-state=running] .card {stroke:var(--accent);stroke-width:2}
.dashboard .node[data-state=failed] .card,.dashboard .node[data-state=cancelled] .card {stroke-dasharray:6 3;stroke-width:2.5}
@keyframes estimate-activity {0%,100%{opacity:1}50%{opacity:.35}}
.motion.dashboard .progress-fill.indeterminate {animation:estimate-activity 2.4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce) {.progress-fill.indeterminate {animation:none!important}}


.viewport.dragging{cursor:grabbing;user-select:none}.viewport svg{touch-action:none}

/* Independently scrolling chrome, graph, details and legends share one viewport. */
.chrome {flex:0 0 auto;min-height:0;overflow:visible}
/* Primary controls never depend on discovering an internal header scrollbar. */
.title-row h1 {overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.title-row {display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.title-row h1 {flex:0 1 auto;min-width:0}
.title-row button {flex-shrink:0}
.panel-layout {display:flex;position:relative;isolation:isolate;flex:1 1 0;min-height:0;overflow:clip}
/* Panels never participate in sizing the canvas. Only their transform moves.
   Retain the closing content for its slide, but remove interaction/accessibility
   immediately via hidden + inert. Visibility is delayed only for the exit slide. */
.detail-panel {position:absolute;top:0;bottom:0;z-index:5;box-shadow:var(--shadow);transform:translateX(0);visibility:visible;overscroll-behavior:contain}
.graph-info {left:0;width:300px;border-left:0;border-right:1px solid var(--line);--closed-offset:-100%}
.inspector {right:0;--closed-offset:100%}
.detail-panel[hidden],.detail-panel.covered {display:flex!important;transform:translateX(var(--closed-offset));visibility:hidden;pointer-events:none}
.motion .detail-panel {transition:transform 180ms ease,visibility 0s linear 180ms}
.motion .detail-panel:not([hidden]):not(.covered) {transition-delay:0s}
@media(prefers-reduced-motion:reduce) {.detail-panel {transition:none!important}}
.panel-header {display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);flex:0 0 auto;font-weight:650;font-size:12px}
.panel-header button {min-height:30px;font-size:12px}
.panel-content {padding:18px 22px 28px;overflow:auto;overscroll-behavior:contain;min-height:0;flex:1 1 auto}
.panel-content:focus-visible,.artifact-legend:focus-visible,.legend-row:focus-visible {outline:3px solid var(--accent);outline-offset:-3px}
.legend-row {display:flex;align-items:center;justify-content:space-between;gap:16px;overflow:auto;overscroll-behavior:contain;min-height:32px;flex:0 0 auto;max-height:46px;padding:2px 3px}
.legend-row button {flex-shrink:0;min-height:28px;padding:3px 8px;font-size:11px}
.graph-heading &gt; div:first-child {min-width:0;flex:1 1 220px}
.view-hint {flex-shrink:0;max-height:24%;overflow:auto}
.work.narrow .detail-panel {width:min(340px,calc(100% - 36px))}
@media(max-width:900px) {
  .toolbar {gap:8px;padding:10px 16px}
  .top {padding:14px 16px}
  .graph-heading {padding:10px 16px}
}
@media(max-width:680px) {
  h1 {font-size:20px}
  .title-row {gap:5px 10px}
  .title-row h1 {flex:1 1 220px}
  .toolbar {gap:8px}
  .registry-label {flex-basis:100%;min-width:0}
  .registry-label select {min-width:0}
  .search-wrap {flex-basis:100%;max-width:none;min-width:0}
  .graph-heading {align-items:flex-start;padding:8px 12px}
  .graph-heading h2 {font-size:15px}
  .footer {padding:6px 10px}
  .toolbar .check {font-size:11px}
  .panel-content {padding:14px 16px 22px}
}
@media(max-height:520px) {
  .top {padding:3px 12px}
  .brand {display:none}
  .title-row {gap:4px 10px;flex-wrap:nowrap}
  .title-row h1 {font-size:15px;margin:0}
  .subtitle {font-size:11px}
  .toolbar {padding:4px 12px;gap:4px 8px}
  .toolbar .registry-label {min-width:160px;flex:1 1 190px}
  .toolbar .search-wrap {min-width:170px;flex:1 1 200px;max-width:none}
  .toolbar button,.toolbar select,.toolbar input[type=search],.theme label,.title-row button {min-height:30px}
  .graph-heading {padding:4px 12px}
  .graph-heading h2 {font-size:14px}
  .graph-heading &gt; div:first-child {flex-basis:180px}
  .tools button {min-height:28px}
  .panel-header {padding:5px 12px}
  .progress-summary {padding:4px 12px;gap:4px 12px}
  .footer {min-height:60px;max-height:60px;padding:2px 10px;gap:0}
  .artifact-legend,.legend-row {min-height:28px}
}

.artifact-legend button &gt; span:last-child {min-width:0;overflow-wrap:anywhere}


.requirement-declaration{font-family:ui-monospace,monospace;overflow-wrap:anywhere}.requirement-conflict{margin-block:12px}.requirement-conflict p{white-space:pre-wrap;overflow-wrap:anywhere}

.graph-identity,.execution-identity {font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.execution-identity {margin:8px 0;border-inline-start:3px solid var(--accent);padding-inline-start:8px}
.paused .elapsed-fact {font-weight:600;color:var(--ink)}
.paused .progress-fill.indeterminate {animation:none!important}

/* Phase 2: existing theme tokens and explicit text, not another status palette. */
.copy-row{display:inline-flex;align-items:center;gap:8px;max-width:100%;flex-wrap:wrap}
.copy-feedback{display:inline-block;min-width:8ch;min-height:1.5em;font-size:12px;color:var(--accent);font-weight:600}
.copy-feedback[data-outcome=failure]{color:var(--ink);text-decoration:underline}
.disabled-reasons{font-size:11px;color:var(--muted);padding-top:4px;max-height:3em;overflow:auto;overflow-wrap:anywhere}
.disabled-reasons[hidden]{display:none}
.paused .elapsed-fact{border-inline-start:3px solid var(--accent);padding-inline-start:6px}
.technical&gt;small{display:block;margin-top:6px}
summary:hover{color:var(--accent)}

/* The same completed overlay is used inside dashboards and saved runs. */
.completed-view .progress {display:inline}
.completed-view .node[data-state=failed] .card,.completed-view .node[data-state=cancelled] .card {stroke-dasharray:6 3;stroke-width:2.5}
/* One theme control for every visualization host. */
.theme-switch{display:flex;align-items:center;gap:12px;border:0;padding:0;margin:0;color:var(--ink);background:transparent;font:14px/1.5 system-ui,sans-serif;flex-shrink:0}
.theme-switch legend{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}
.theme-switch label{display:inline-flex;align-items:center;gap:6px;min-height:36px;font-weight:400;white-space:nowrap;cursor:pointer}
.theme-switch input[type=radio]{appearance:auto;width:18px;height:18px;min-height:0;margin:0;padding:0;accent-color:var(--accent);cursor:pointer}
.theme-switch input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
&lt;/style&gt;&lt;style&gt;/* Inherit each surface&#x27;s existing palette; no separate help color system. */
