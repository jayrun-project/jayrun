[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jayrun"
version = "0.1.0"
description = "Artifact-centric execution for iterative graphs, shared resources, and placement-aware workloads"
readme = {file = "README.md", content-type = "text/markdown"}
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Masoud Yavari"},
]
requires-python = ">=3.11"
dependencies = ["packaging>=23.2"]
keywords = [
    "artifacts",
    "dag",
    "execution",
    "orchestration",
    "resources",
    "scheduling",
    "workflow",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
plotting = ["pyvis>=0.3.2"]

[project.urls]
Homepage = "https://github.com/jayrun-project/jayrun"
Documentation = "https://jayrun.readthedocs.io/"
Repository = "https://github.com/jayrun-project/jayrun"
Issues = "https://github.com/jayrun-project/jayrun/issues"
Changelog = "https://github.com/jayrun-project/jayrun/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["jayrun*"]
exclude = ["examples*", "tests*"]

[tool.setuptools.package-data]
jayrun = ["py.typed"]
