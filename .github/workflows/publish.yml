name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check public source and versions
        run: python .github/scripts/release_check.py
      - name: Validate tag version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$tag_version" = "$project_version"
      - name: Install release tools
        run: |
          python -m pip install --upgrade build twine
          python -m pip install . -r docs/requirements.txt
      - name: Build documentation
        run: python -m sphinx -a -E -W --keep-going -b html docs docs/_build/html
      - name: Validate documentation links
        run: python .github/scripts/check_links.py --html docs/_build/html
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: |
          python -m twine check --strict dist/*
          python .github/scripts/release_check.py --dist dist
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  verify-wheel:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Check exact publication artifacts
        run: python .github/scripts/release_check.py --dist dist
      - name: Install exact wheel with minimum runtime dependency
        run: |
          python -m pip install "packaging==25.0"
          python -m pip install dist/*.whl
          python -m pip check
      - name: Verify installed wheel
        run: python -I .github/scripts/wheel_smoke.py --source "$GITHUB_WORKSPACE"
      - name: Verify current dependency and optional YAML
        run: |
          python -m pip install --upgrade packaging "PyYAML>=6.0"
          python -I .github/scripts/wheel_smoke.py --source "$GITHUB_WORKSPACE" --yaml

  publish:
    needs: [build, verify-wheel]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jayrun
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Jayrun ${GITHUB_REF_NAME#v}"
