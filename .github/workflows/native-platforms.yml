name: Native platform qualification

on:
  push:
    branches: ["qa/windows-macos-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install Jayrun with optional YAML
        run: python -m pip install ".[yaml]"
      - name: Check native memory, admission and default database
        run: python -I .github/scripts/native_platform_smoke.py
      - name: Exercise installed public framework and examples
        run: python -I .github/scripts/wheel_smoke.py --source . --yaml
