name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Check public source and versions
        run: python .github/scripts/release_check.py
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: |
          python -m twine check --strict dist/*
          python .github/scripts/release_check.py --dist dist
      - name: Install wheel with minimum runtime dependency
        run: |
          python -m pip install "packaging==25.0"
          python -m pip install dist/*.whl
          python -m pip check
      - name: Verify installed wheel outside checkout imports
        run: python -I .github/scripts/wheel_smoke.py --source "$GITHUB_WORKSPACE"
      - name: Verify current runtime dependency and optional YAML
        run: |
          python -m pip install --upgrade packaging "PyYAML>=6.0"
          python -I .github/scripts/wheel_smoke.py --source "$GITHUB_WORKSPACE" --yaml
