name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      check_live:
        description: Check public URLs after GitHub and Read the Docs deployment
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            docs/requirements.txt
      - name: Check public source and asset provenance
        run: python .github/scripts/release_check.py
      - name: Install project and documentation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install . -r docs/requirements.txt
      - name: Build documentation
        run: python -m sphinx -a -E -W --keep-going -b html docs docs/_build/html
      - name: Validate internal and proposed public links
        run: python .github/scripts/check_links.py --html docs/_build/html
      - name: Check deployed links
        if: ${{ inputs.check_live }}
        run: python .github/scripts/check_links.py --html docs/_build/html --live
